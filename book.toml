[book]
title = "Data Structures in Rust"
authors = ["Bijan"]
description = "An interactive guide to data structures in Rust from first principles."
language = "en"
src = "book-src"

[build]
build-dir = "book"

[rust]
edition = "2024"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/toolbox.css", "theme/vecdeque-ring-buffer.css", "theme/structure-demos.css"]
additional-js = ["theme/vecdeque-ring-buffer.js", "theme/structure-demos.js"]
git-repository-url = "https://github.com/beejmaxx/data-structures-in-rust"
edit-url-template = "https://github.com/beejmaxx/data-structures-in-rust/edit/main/{path}"
site-url = "/data-structures-in-rust/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.fold]
enable = true
level = 1
