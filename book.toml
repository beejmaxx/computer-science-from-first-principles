[book]
title = "Computer Science from First Principles"
authors = ["Bijan"]
description = "Interactive foundations for high-performance, low-latency systems, with practical Rust implementations."
language = "en"
src = "book-src"

[build]
build-dir = "book"

[rust]
edition = "2024"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/toolbox.css", "theme/vecdeque-ring-buffer.css", "theme/structure-demos.css", "theme/algorithm-demos.css"]
additional-js = ["theme/vecdeque-ring-buffer.js", "theme/structure-demos.js", "theme/algorithm-demos.js"]
git-repository-url = "https://github.com/beejmaxx/computer-science-from-first-principles"
edit-url-template = "https://github.com/beejmaxx/computer-science-from-first-principles/edit/main/{path}"
site-url = "/computer-science-from-first-principles/"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.html.fold]
enable = true
level = 1
